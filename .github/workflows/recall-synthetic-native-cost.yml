name: Synthetic native outbox checkpoint cost

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recall-synthetic-native-cost.yml
      - tool/fixtures/synthetic_native_outbox_cost_main.dart
      - test/synthetic_native_outbox_cost_test.dart
      - tool/fixtures/checkpoint-drain-only.patch
      - tool/prepare_native_checkpoint_cost.py
      - tool/run_native_checkpoint_cost.py
      - tool/native_checkpoint_contract.py
      - tool/tests/test_native_checkpoint_cost.py
      - tool/tests/test_native_cost_workflow.py
      - tool/fixtures/README-native-checkpoint-cost.md
      - tool/measure_android_cold_start.py
      - tool/run_synthetic_native_offline_restart.py
      - tool/native_offline_receipt_contract.py
      - tool/fixtures/synthetic_recall_flow.dart
      - test/test_synthetic_native_prepare.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recall-synthetic-native-cost.yml
      - tool/fixtures/synthetic_native_outbox_cost_main.dart
      - test/synthetic_native_outbox_cost_test.dart
      - tool/fixtures/checkpoint-drain-only.patch
      - tool/prepare_native_checkpoint_cost.py
      - tool/run_native_checkpoint_cost.py
      - tool/native_checkpoint_contract.py
      - tool/tests/test_native_checkpoint_cost.py
      - tool/tests/test_native_cost_workflow.py
      - tool/fixtures/README-native-checkpoint-cost.md
      - tool/measure_android_cold_start.py
      - tool/run_synthetic_native_offline_restart.py
      - tool/native_offline_receipt_contract.py
      - tool/fixtures/synthetic_recall_flow.dart
      - test/test_synthetic_native_prepare.py

permissions:
  contents: read

concurrency:
  group: synthetic-native-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-native-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require disposable hosted Linux and own output paths
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          echo "COST_SOURCE=$RUNNER_TEMP/recall-native-cost-${{ github.run_id }}-${{ github.run_attempt }}/source" >> "$GITHUB_ENV"
          echo "COST_RESULTS=$RUNNER_TEMP/recall-native-cost-${{ github.run_id }}-${{ github.run_attempt }}/results" >> "$GITHUB_ENV"
      - name: Validate normal Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Install compile SDK matching normal Android source
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"
      - name: Qualify mocked contracts before compilation
        run: |
          PYTHONPATH=. python3 -B test/test_synthetic_native_prepare.py
          PYTHONPATH=tool python3 -B -m unittest discover -s tool/tests -p 'test_native_checkpoint_cost.py'
          python3 tool/measure_android_cold_start.py self-test
      - name: Prepare two fresh pinned technical copies
        run: |
          mkdir -m 700 -p "$COST_RESULTS"
          python3 tool/prepare_native_checkpoint_cost.py \
            --source "$GITHUB_WORKSPACE" --destination "$COST_SOURCE/baseline" \
            --source-commit "$GITHUB_SHA" --variant baseline \
            --patch tool/fixtures/checkpoint-drain-only.patch \
            --fixture-sha 81e0c27acf476d932a00b6c48151b9ecf1234a7800142955baa4d55cb1ba3662 \
            > "$COST_RESULTS/base-provenance.json"
          python3 tool/prepare_native_checkpoint_cost.py \
            --source "$GITHUB_WORKSPACE" --destination "$COST_SOURCE/checkpoint" \
            --source-commit "$GITHUB_SHA" --variant checkpoint \
            --patch tool/fixtures/checkpoint-drain-only.patch \
            --fixture-sha 81e0c27acf476d932a00b6c48151b9ecf1234a7800142955baa4d55cb1ba3662 \
            > "$COST_RESULTS/checkpoint-provenance.json"
      - name: Build isolated baseline debug APK
        working-directory: ${{ env.COST_SOURCE }}/baseline
        run: |
          flutter pub get
          flutter build apk --debug --no-pub \
            --target tool/fixtures/synthetic_native_outbox_cost_main.dart \
            --dart-define=RECALL_SYNTHETIC_NATIVE_OUTBOX_COST=true \
            --dart-define=RECALL_SOURCE_COMMIT="$GITHUB_SHA" \
            --dart-define=RECALL_BASE_COMMIT=bae90089cb6b9fe3f2eb66513d84a9bb11ad0c5a \
            --dart-define=RECALL_VARIANT=baseline \
            --dart-define=RECALL_CONTROLLER_SHA256=c8fc79c32fe0551ab615fcf01577d454fba2b2483b8d5543a9e56ab2c678cb63 \
            --dart-define=RECALL_PATCH_SHA256=none \
            --dart-define=RECALL_FIXTURE_SHA256=81e0c27acf476d932a00b6c48151b9ecf1234a7800142955baa4d55cb1ba3662
      - name: Build isolated checkpoint debug APK
        working-directory: ${{ env.COST_SOURCE }}/checkpoint
        run: |
          flutter pub get
          flutter build apk --debug --no-pub \
            --target tool/fixtures/synthetic_native_outbox_cost_main.dart \
            --dart-define=RECALL_SYNTHETIC_NATIVE_OUTBOX_COST=true \
            --dart-define=RECALL_SOURCE_COMMIT="$GITHUB_SHA" \
            --dart-define=RECALL_BASE_COMMIT=bae90089cb6b9fe3f2eb66513d84a9bb11ad0c5a \
            --dart-define=RECALL_VARIANT=checkpoint \
            --dart-define=RECALL_CONTROLLER_SHA256=5f18a20d911a401b579dc682903bc1be5c2e53c61fd1ace4b0b440774348c6f6 \
            --dart-define=RECALL_PATCH_SHA256=477cd41c821ca72765ee37a9aced795f07bfc69c3b57179f5be3de1e6f814a3a \
            --dart-define=RECALL_FIXTURE_SHA256=81e0c27acf476d932a00b6c48151b9ecf1234a7800142955baa4d55cb1ba3662
      - name: Stop only these two disposable Gradle daemons before emulator
        run: |
          (cd "$COST_SOURCE/baseline/android" && ./gradlew --stop)
          (cd "$COST_SOURCE/checkpoint/android" && ./gradlew --stop)
      - name: Require hosted KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Four guarded process launches on one disposable AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: recall-native-cost-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -camera-back none -camera-front none
          disable-animations: true
          script: >-
            python3 "$GITHUB_WORKSPACE/tool/run_native_checkpoint_cost.py"
            --source-commit "$GITHUB_SHA"
            --baseline-apk "$COST_SOURCE/baseline/build/app/outputs/flutter-apk/app-debug.apk"
            --checkpoint-apk "$COST_SOURCE/checkpoint/build/app/outputs/flutter-apk/app-debug.apk"
            --baseline-provenance "$COST_RESULTS/base-provenance.json"
            --checkpoint-provenance "$COST_RESULTS/checkpoint-provenance.json"
            --output "$COST_RESULTS/native" --phase-timeout 90
      - name: Retain only closed source and comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-native-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.COST_RESULTS }}/base-provenance.json
            ${{ env.COST_RESULTS }}/checkpoint-provenance.json
            ${{ env.COST_RESULTS }}/native/comparison.json
          retention-days: 2
          if-no-files-found: error
          compression-level: 9
