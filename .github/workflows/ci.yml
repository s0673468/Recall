name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  concept-sync-safety:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install concept-sync test dependencies
        run: python -m pip install -r tools/recall_sync/requirements.txt

      - name: Test additive concept sync
        run: python -m unittest discover -s tools/recall_sync/tests

      - name: Test guarded Anki revision tools
        run: python -m unittest discover -s tools/anki_revision/tests -p 'test_*.py'

      - name: Test semantic review compiler
        run: python -m unittest discover -s tools/semantic_review/tests -p 'test_*.py'

  flutter:
    timeout-minutes: 30
    # Public repo: GitHub-hosted runners are free & unlimited. Self-hosted must
    # NEVER run on a public repo (fork PRs would execute on the M1 hub).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: ./tool/flutterw pub get

      # analyze_options treats infos/warnings as fatal, matching the local gate.
      - name: flutter analyze
        run: ./tool/flutterw analyze

      - name: flutter test
        run: ./tool/flutterw test --reporter=failures-only

      - name: Test pinned Flutter tooling
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Test Pages build finisher
        run: python3 -m unittest discover -s web/tool/tests -p 'test_*.py'

      - name: Build deployable web bundle
        run: |
          ./tool/flutterw build web --release --no-pub --base-href /Recall/ \
            --no-web-resources-cdn
          python3 web/tool/stamp_service_worker.py build/web "$GITHUB_SHA"

  android-native:
    timeout-minutes: 35
    # Recall is public. Hosted Linux keeps fork PRs away from private runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK 37
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"

      - name: flutter pub get
        run: ./tool/flutterw pub get

      - name: Compile Android debug host
        run: ./tool/flutterw build apk --debug --no-pub

      - name: Check signed-release refusal and unsigned staging policy
        run: python3 tool/check_android_release_policy.py

      - name: Android unit, lint and instrumentation build checks
        working-directory: android
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebugAndroidTest --no-daemon --max-workers=2

      - name: Print Android lint findings on failure
        if: failure()
        shell: bash
        run: |
          report="build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "$report" ]]; then
            cat "$report"
          fi

      - name: Build isolated Android acceptance fixture
        env:
          ORG_GRADLE_PROJECT_recallAndroidAcceptance: 'true'
        run: >-
          ./tool/flutterw build apk --debug --no-pub
          --no-android-gradle-daemon --target-platform android-arm64
          -t tool/android_acceptance.dart
          --dart-define=RECALL_ANDROID_ACCEPTANCE=true

      - name: Verify acceptance package and network isolation
        run: |
          python3 tool/check_android_acceptance_apk.py build/app/outputs/flutter-apk/app-debug.apk \
            --apkanalyzer "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            > build/app/outputs/flutter-apk/acceptance-identity.json

      - name: Retain invented-data APK for admitted emulator acceptance
        uses: actions/upload-artifact@v7
        with:
          name: android-acceptance-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/acceptance-identity.json
          if-no-files-found: error
          retention-days: 1

  flag-report:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install flag-report dependencies
        run: python -m pip install -r tools/flag_report/requirements.txt

      - name: Test read-only flag report
        run: python -m unittest discover -s tools/flag_report/tests -p 'test_*.py'

  testflight-helper:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test TestFlight delivery helper
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  fsrs-optimizer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install FSRS optimizer dependencies
        run: python -m pip install -r tools/fsrs_optimize/requirements.txt

      - name: Test report-only FSRS optimizer
        run: python -m unittest discover -s tools/fsrs_optimize/tests -p 'test_*.py'

  ios-native:
    timeout-minutes: 40
    # Public repo: native Apple tests use a GitHub-hosted Mac, never the M1 hub.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: ./tool/flutterw pub get

      - name: Prepare iOS simulator configuration
        run: >-
          ./tool/flutterw build ios --debug --simulator --config-only --no-codesign
          --no-pub

      - name: Run native iOS tests
        run: >-
          python3 tool/run_ios_tests.py --
          -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
