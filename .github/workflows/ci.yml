name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  concept-sync-safety:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install concept-sync test dependencies
        run: python -m pip install -r tools/recall_sync/requirements.txt

      - name: Test additive concept sync
        run: python -m unittest discover -s tools/recall_sync/tests

      - name: Test guarded Anki revision tools
        run: python -m unittest discover -s tools/anki_revision/tests -p 'test_*.py'

      - name: Test semantic review compiler
        run: python -m unittest discover -s tools/semantic_review/tests -p 'test_*.py'

  flutter-checks:
    timeout-minutes: 20
    # Public repo: GitHub-hosted runners are free & unlimited. Self-hosted must
    # NEVER run on a public repo (fork PRs would execute on the M1 hub).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: ./tool/flutterw pub get

      # analyze_options treats infos/warnings as fatal, matching the local gate.
      - name: flutter analyze
        run: ./tool/flutterw analyze

      - name: Test browser quota classification
        run: >-
          ./tool/flutterw test --no-pub --platform chrome --concurrency=1
          test/local_review_quota_classifier_web_test.dart

      - name: Test pinned Flutter tooling
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

  flutter-tests:
    timeout-minutes: 20
    # The suite is split by whole file across hosted runners, so each shard
    # compiles only its own files. Hosted Linux, as above.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every failing shard instead of cancelling the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD_TOTAL: 3
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: ./tool/flutterw pub get

      # Hosted runners have four vCPUs; package:test would default to two.
      # A failed shard listing stops the step instead of running every file.
      - name: flutter test (file shard)
        run: |
          shard_files="$(python3 tool/flutter_test_shards.py --total "$SHARD_TOTAL" --index "$SHARD_INDEX")"
          # shellcheck disable=SC2086
          ./tool/flutterw test --reporter=failures-only --exclude-tags apple-mobile --no-pub --concurrency=4 $shard_files

  flutter:
    # Keeps the required check context. The Flutter work runs in the jobs above;
    # this passes only when the checks and every test shard succeeded.
    if: always()
    needs: [flutter-checks, flutter-tests]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require Flutter checks and every test shard
        env:
          CHECKS_RESULT: ${{ needs.flutter-checks.result }}
          TESTS_RESULT: ${{ needs.flutter-tests.result }}
        run: |
          echo "flutter-checks: $CHECKS_RESULT, flutter-tests: $TESTS_RESULT"
          [[ "$CHECKS_RESULT" == success && "$TESTS_RESULT" == success ]]

  android-build:
    timeout-minutes: 35
    # Recall is public. Hosted Linux keeps fork PRs away from private runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Restores ~/.gradle caches and the wrapper distribution. The key hashes
          # the Gradle build files, so dependency changes start a fresh entry.
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK 37
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"

      - name: flutter pub get
        run: ./tool/flutterw pub get

      - name: Compile Android debug host
        run: ./tool/flutterw build apk --debug --no-pub

      # The hosted VM is discarded after the job, so the four policy probes may
      # reuse the Gradle daemon that the debug build just warmed. Local and
      # compute-host runs keep --no-daemon and leave no background JVM behind.
      - name: Check signed-release refusal and unsigned staging policy
        env:
          RECALL_GRADLE_DAEMON: "1"
        run: python3 tool/check_android_release_policy.py

  android-gradle-checks:
    timeout-minutes: 35
    # Unit tests and lint run beside the debug build instead of after it, so the
    # Android lane is no longer the sum of both. Hosted Linux, as above.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Same key as android-build, so both jobs share one Gradle cache entry.
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Install Android SDK 37
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"

      - name: flutter pub get
        run: ./tool/flutterw pub get

      - name: Android unit, lint and instrumentation build checks
        working-directory: android
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebugAndroidTest --no-daemon --max-workers=2

      - name: Print Android lint findings on failure
        if: failure()
        shell: bash
        run: |
          report="build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "$report" ]]; then
            cat "$report"
          fi

  android-native:
    # Keeps the required check context. The Android work runs in the two parallel
    # jobs above; this passes only when both of them succeeded. A plain `needs`
    # would be skipped on failure, and a skipped required check counts as passed.
    if: always()
    needs: [android-build, android-gradle-checks]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require both Android lanes
        env:
          BUILD_RESULT: ${{ needs.android-build.result }}
          CHECKS_RESULT: ${{ needs.android-gradle-checks.result }}
        run: |
          echo "android-build: $BUILD_RESULT, android-gradle-checks: $CHECKS_RESULT"
          [[ "$BUILD_RESULT" == success && "$CHECKS_RESULT" == success ]]

  flag-report:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install flag-report dependencies
        run: python -m pip install -r tools/flag_report/requirements.txt

      - name: Test read-only flag report
        run: python -m unittest discover -s tools/flag_report/tests -p 'test_*.py'

  testflight-helper:
    # Retired under the Android/web platform policy; preserve the check context.
    if: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test TestFlight delivery helper
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  fsrs-optimizer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install FSRS optimizer dependencies
        run: python -m pip install -r tools/fsrs_optimize/requirements.txt

      - name: Test report-only FSRS optimizer
        run: python -m unittest discover -s tools/fsrs_optimize/tests -p 'test_*.py'

  ios-native:
    # Retired under the Android/web platform policy; preserve the check context.
    if: false
    timeout-minutes: 40
    # Public repo: native Apple tests use a GitHub-hosted Mac, never the M1 hub.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: ./tool/flutterw pub get

      - name: Prepare iOS simulator configuration
        run: >-
          ./tool/flutterw build ios --debug --simulator --config-only --no-codesign
          --no-pub

      - name: Run native iOS tests
        run: >-
          python3 tool/run_ios_tests.py --
          -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
