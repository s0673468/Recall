name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  concept-sync-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install concept-sync test dependencies
        run: python -m pip install -r tools/recall_sync/requirements.txt

      - name: Test additive concept sync
        run: python -m unittest discover -s tools/recall_sync/tests

      - name: Test guarded Anki revision tools
        run: python -m unittest discover -s tools/anki_revision/tests -p 'test_*.py'

      - name: Test semantic review compiler
        run: python -m unittest discover -s tools/semantic_review/tests -p 'test_*.py'

  flutter:
    # Public repo: GitHub-hosted runners are free & unlimited. Self-hosted must
    # NEVER run on a public repo (fork PRs would execute on the M1 hub).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: flutter pub get

      # analyze_options treats infos/warnings as fatal, matching the local gate.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter=failures-only

  android-native:
    # Recall is public. Hosted Linux keeps fork PRs away from private runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        run: flutter pub get

      - name: Compile Android debug host
        run: flutter build apk --debug --no-pub

      - name: Android unit and instrumentation build checks
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
