name: Deploy Recall to Pages

# Manual-only on purpose. Recall is a public repo on the personal account
# (s0673468/Recall), so Pages is available on the free plan and the site is live
# at https://s0673468.github.io/Recall/. Health no longer serves the PWA.
#
# It stays `workflow_dispatch` rather than push-triggered because publishing is a
# release decision, not a side effect of merging: main carries work that is not
# meant to be live yet, so the deployed build is intentionally allowed to lag
# main. Trigger a deploy by hand from the Actions tab when the live site should
# move. PRs are gated by CI's `flutter` job; this workflow is never a required
# check.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      # config/supabase.local.json is git-ignored; CI materializes it from repo
      # secrets. Publishable URL + anon key ONLY — RLS gates all data behind
      # interactive auth, and the AUTO_LOGIN_* creds must never ship to web.
      # Recall runs on its OWN Supabase project, so it reads ANKI_SUPABASE_*.
      - name: Write Recall config
        env:
          ANKI_SUPABASE_URL: ${{ secrets.ANKI_SUPABASE_URL }}
          ANKI_SUPABASE_ANON_KEY: ${{ secrets.ANKI_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' \
            "$ANKI_SUPABASE_URL" "$ANKI_SUPABASE_ANON_KEY" > config/supabase.local.json

      - name: Build Recall web
        run: |
          flutter pub get
          # Project Pages site serves at /<repo>/, so base-href is /Recall/.
          # --no-web-resources-cdn pins local canvaskit; config is compiled in via
          # --dart-define (String.fromEnvironment), never bundled as a secret asset.
          flutter build web --release --base-href /Recall/ \
            --no-web-resources-cdn --pwa-strategy=none \
            --dart-define-from-file=config/supabase.local.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
