name: Deploy Recall to Pages

# The built-in Flutter PWA is retired. Keep the historical workflow/check
# context inert for both main pushes and manual dispatches.
# This does not remove an existing hosted site or alter browser storage.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Built-in Recall PWA retired
        run: echo "Use the existing Recall Hub client bookmark; see web/README.md."
